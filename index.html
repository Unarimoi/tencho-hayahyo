<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>転調早見表</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;background:#f5f6f8;color:#222}
  .wrap{max-width:760px;margin:40px auto;padding:24px}
  .card{background:#fff;border-radius:16px;padding:28px;box-shadow:0 6px 24px rgba(0,0,0,.08)}
  h1{font-size:28px;margin:0 0 8px}
  .desc{color:#666;margin:0 0 24px;line-height:1.7}
  .controls{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px}
  label{display:block;font-weight:700;margin-bottom:8px}
  select{width:100%;padding:12px;border:1px solid #ccc;border-radius:10px;background:#fff;font-size:16px}
  .result{background:#f7f8fa;border-radius:12px;padding:16px;margin-bottom:18px}
  .result strong{font-size:18px}
  .rule{color:#666;font-size:14px;margin-top:6px}
  table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden}
  th,td{padding:13px 10px;border-bottom:1px solid #e5e5e5;text-align:center}
  th{background:#f0f1f3;font-weight:700}
  tr:last-child td{border-bottom:none}
  td.arrow{color:#777;font-size:18px}
  .note{font-weight:700;font-size:18px}
  .foot{font-size:13px;color:#777;line-height:1.7;margin-top:18px}
  @media(max-width:560px){.wrap{margin:16px auto;padding:12px}.card{padding:20px}.controls{grid-template-columns:1fr}.note{font-size:17px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>転調早見表</h1>
    <p class="desc">ハンドパン用。基準キーの「音階上の1〜7度」を、転調先キーの「1〜7度」へ対応させます。</p>

    <div class="controls">
      <div>
        <label for="source">基準キー</label>
        <select id="source"></select>
      </div>
      <div>
        <label for="target">転調先のキー</label>
        <select id="target"></select>
      </div>
    </div>

    <div class="result">
      <strong id="title"></strong>
      <div class="rule">音階の度数をそのまま対応：1→1、2→2、3→3、…、7→7</div>
    </div>

    <table>
      <thead><tr><th>度数</th><th>基準キー</th><th></th><th>転調先</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>

    <div class="foot">
      ※ この表は単純な半音移動ではありません。たとえば C major → D minor なら、C D E F G A B を D E F G A Bb C に対応させます。<br>
      ※ メジャーとナチュラルマイナーのみを使用します。
    </div>
  </div>
</div>

<script>
const roots = [
  {name:'C', pc:0}, {name:'C#', pc:1}, {name:'D', pc:2}, {name:'Eb', pc:3},
  {name:'E', pc:4}, {name:'F', pc:5}, {name:'F#', pc:6}, {name:'G', pc:7},
  {name:'Ab', pc:8}, {name:'A', pc:9}, {name:'Bb', pc:10}, {name:'B', pc:11}
];
const modes = [
  {name:'major', label:'major', intervals:[0,2,4,5,7,9,11]},
  {name:'minor', label:'minor', intervals:[0,2,3,5,7,8,10]}
];

// Practical spelling for the 12 chromatic roots.
// Flats are used for flat-key spellings such as D minor = D E F G A Bb C.
const sharpNames = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const flatNames  = ['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
const flatRootPCs = new Set([1,3,5,6,8,10]);

function keyLabel(key){ return `${key.root.name} ${key.mode.label}`; }
function scaleNotes(key){
  const useFlats = flatRootPCs.has(key.root.pc) || key.root.name.includes('b');
  const names = useFlats ? flatNames : sharpNames;
  return key.mode.intervals.map(i => names[(key.root.pc+i)%12]);
}

const keys=[];
roots.forEach(root=>modes.forEach(mode=>keys.push({root,mode})));

const sourceEl=document.getElementById('source');
const targetEl=document.getElementById('target');
keys.forEach((key,i)=>{
  const opt=document.createElement('option');
  opt.value=i; opt.textContent=keyLabel(key); sourceEl.appendChild(opt);
  const opt2=opt.cloneNode(true); targetEl.appendChild(opt2);
});
// Default: C major -> D minor
sourceEl.value=keys.findIndex(k=>k.root.name==='C'&&k.mode.name==='major');
targetEl.value=keys.findIndex(k=>k.root.name==='D'&&k.mode.name==='minor');

function render(){
  const source=keys[Number(sourceEl.value)];
  const target=keys[Number(targetEl.value)];
  const s=scaleNotes(source), t=scaleNotes(target);
  document.getElementById('title').textContent=`${keyLabel(source)} → ${keyLabel(target)}`;
  const tbody=document.getElementById('rows'); tbody.innerHTML='';
  const degrees=['1','2','3','4','5','6','7'];
  for(let i=0;i<7;i++){
    const tr=document.createElement('tr');
    tr.innerHTML=`<td>${degrees[i]}</td><td class="note">${s[i]}</td><td class="arrow">→</td><td class="note">${t[i]}</td>`;
    tbody.appendChild(tr);
  }
}
sourceEl.addEventListener('change',render);
targetEl.addEventListener('change',render);
render();
</script>
</body>
</html>
